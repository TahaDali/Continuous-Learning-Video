name: Validate skills and video starter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --prefix skills/continuous-learning-videos/assets/starter/production-source
      - name: Check resources and render the silent demonstration
        run: python3 scripts/check.py --render
      - name: Check validation regressions and the isolated combined skill
        run: python3 -m unittest discover -s tests -v
