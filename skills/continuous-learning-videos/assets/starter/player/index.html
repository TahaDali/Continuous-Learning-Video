<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning course</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><p class="eyebrow">LEARN THROUGH MOTION</p><h1 id="course-title">Learning course</h1><p id="runtime"></p></header>
<main>
<button id="browse" aria-expanded="false" aria-controls="lesson-list">Show lessons</button>
<nav id="lesson-list" aria-label="Lessons" hidden></nav>
<article><p id="lesson-number"></p><h2 id="lesson-title" tabindex="-1"></h2><p id="goal"></p>
<div class="video-wrap"><video id="video" controls playsinline preload="metadata" aria-label="Lesson video"></video></div>
<p id="error" hidden>Playback could not start. Try the MP4 download or another browser.</p>
<div class="controls"><button id="previous">← Previous</button><button id="next">Next →</button><label>Speed <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="captions" aria-pressed="false">Captions off</button><button id="complete" aria-pressed="false">Mark complete</button></div>
<p><a id="download-video" download>Download MP4</a> · <a id="download-captions" download>Download captions</a></p>
<details><summary>Transcript and jump points</summary><div id="transcript"></div></details>
<details><summary>Source coverage</summary><p id="coverage"></p></details>
</article></main><footer><p id="completion"></p></footer>
<script src="course-data.js"></script><script src="player.js"></script>
</body></html>
